<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Odin Todo List</title>
<script defer src="main.js"></script></head>
<body>
  <div id="app">
    <!-- Sidebar for Projects -->
    <aside class="sidebar">
      <h2>Projects</h2>
      <ul id="projects-list"></ul>
      <button id="add-project-btn">+ New Project</button>
    </aside>

    <!-- Main Content Area for Tasks -->
    <main class="content">
      <header id="project-header">
        <h1 id="project-title">Inbox</h1>
      </header>

      <div id="todos-container"></div>
      
      <button id="add-todo-btn">+ Add Task</button>
    </main>

    <!-- Add Task Modal -->
    <dialog id="todo-modal">
  <form id="todo-form">
    <h3>New Task</h3>
    
    <div class="form-group">
      <label for="todo-title">Title</label>
      <input type="text" id="todo-title" required placeholder="a title for the task">
    </div>

    <div class="form-group">
      <label for="todo-description">Description</label>
      <textarea id="todo-description" rows="2" placeholder="Optional details..."></textarea>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="todo-duedate">Due Date</label>
        <input type="date" id="todo-duedate">
      </div>

      <div class="form-group">
        <label for="todo-priority">Priority</label>
        <select id="todo-priority">
          <option value="Low">Low</option>
          <option value="Medium" selected>Medium</option>
          <option value="High">High</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="todo-notes">Notes</label>
      <textarea id="todo-notes" rows="2" placeholder="Extra notes or links..."></textarea>
    </div>

    <div class="form-actions">
      <button type="button" id="cancel-todo-btn" class="secondary-btn">Cancel</button>
      <button type="submit" class="primary-btn">Save Task</button>
    </div>
  </form>
    </dialog>
  </div>
</body>
</html>
